name: Validate Scanner UX V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-ux-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch syntax
        run: |
          python3 -m py_compile scripts/apply_scanner_ux_v2.py
          python3 -m py_compile scripts/apply_reputation_visibility.py
          python3 -m py_compile scripts/apply_plain_language.py

      - name: Build site
        run: bash build.sh

      - name: Validate scanner UX
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="input-kind"' dist/index.html
          grep -q 'id="scan-progress"' dist/index.html
          grep -q 'Checking the link…' dist/index.html
          grep -q 'Checking the email address…' dist/index.html
          grep -q 'Website address · Where it goes · Fake-site signs · Downloads' dist/index.html
          grep -q 'Address · Mail setup · Copycat signs · Website age' dist/index.html
          grep -q 'id="why-verdict"' dist/index.html
          grep -q 'Why am I seeing this result?' dist/index.html
          grep -q 'id="contextual-prevention"' dist/index.html
          grep -q 'renderScannerUx(d)' dist/index.html
          grep -q "lastVerdict=status==='low'?'No obvious warning signs yet'" dist/index.html
          grep -q "status==='high'?'High-risk email'" dist/index.html
          grep -q "status==='high'?'Dangerous link signs'" dist/index.html
          grep -q 'input.addEventListener('"'"'input'"'"',updateInputKind)' dist/index.html
          grep -q 'setScanProgress(!!on)' dist/index.html
          grep -q 'href="/scam-prevention"' dist/index.html
          grep -q '/scam-warning-signs' dist/index.html
          grep -q '/can-a-link-give-you-a-virus' dist/index.html
          grep -q '/how-to-tell-if-a-link-is-phishing' dist/index.html
          grep -q '/redirect-risk-explained' dist/index.html
          grep -qi '#8ea2ff' dist/index.html

      - name: Validate plain-language safety hierarchy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="check-grid"' dist/index.html
          grep -q '<strong>Fake websites</strong>' dist/index.html
          grep -q '<strong>Harmful files</strong>' dist/index.html
          grep -q '<strong>Link destination</strong>' dist/index.html
          grep -q '<strong>Copycat sites</strong>' dist/index.html
          grep -q 'Nothing you paste is saved' dist/index.html
          grep -q 'No account needed' dist/index.html
          grep -q 'Warning-sign score' dist/index.html
          grep -q 'One more check recommended' dist/index.html
          grep -q 'Run extra safety check' dist/index.html
          grep -q 'Dangerous link — do not open' dist/index.html
          grep -q 'No known danger found in security lists' dist/index.html
          grep -q "riskMeter.classList.add('hidden')" dist/index.html

      - name: Validate contextual guide destinations
        shell: bash
        run: |
          set -euo pipefail
          for slug in scam-prevention scam-warning-signs can-a-link-give-you-a-virus how-to-tell-if-a-link-is-phishing redirect-risk-explained; do
            test -s "dist/${slug}.html"
          done

      - name: Preserve privacy and technical disclosure
        shell: bash
        run: |
          set -euo pipefail
          grep -q "if(currentInputType==='url')trackScanSummary(d)" dist/index.html
          grep -q 'Technical details <span class="advanced-label">(advanced)</span>' dist/index.html
          grep -q 'For advanced users. These technical signals help explain the result' dist/index.html
          ! grep -qi '100% safe' dist/index.html
