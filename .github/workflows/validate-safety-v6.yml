name: Validate Link Safety V6.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-v62:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate safety API syntax
        run: |
          node --check api/check.js
          node --check api/deep-check.js

      - name: Build site with minimal homepage
        run: bash build.sh

      - name: Validate safety SEO routes
        shell: bash
        run: |
          set -euo pipefail
          for page in safe-link-checker scam-link-checker phishing-link-checker; do
            test -f "dist/$page.html"
            grep -q '<meta name="robots" content="index,follow">' "dist/$page.html"
            grep -q "https://canisharethis.com/$page" "dist/$page.html"
            grep -q "https://canisharethis.com/$page" dist/sitemap.xml
          done

      - name: Validate 3-second homepage
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<h1 id="page-title">Is this link safe?</h1>' dist/index.html
          grep -q 'placeholder="Paste a link here…"' dist/index.html
          grep -q '>Analyze</button>' dist/index.html
          grep -q 'id="result"' dist/index.html
          grep -q 'Check reputation too' dist/index.html
          grep -q '/api/deep-check' dist/index.html
          grep -q 'href="/safe-link-checker"' dist/index.html
          grep -q 'href="/scam-link-checker"' dist/index.html
          grep -q 'href="/phishing-link-checker"' dist/index.html
          grep -q 'href="/google-drive-link-checker"' dist/index.html
          grep -q 'href="/dropbox-link-checker"' dist/index.html
          ! grep -q 'Three steps before you hit Send' dist/index.html
          ! grep -q 'RECIPIENT PREVIEW' dist/index.html
          ! grep -q 'Recognizes 91+' dist/index.html
          ! grep -q 'Quick CheckDeep Safety Scan' dist/index.html

      - name: Validate safety API contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'riskScore' api/check.js
          grep -q 'brand-lookalike patterns' api/check.js
          grep -q 'Privacy-first mode' api/check.js
          grep -q 'body.consent !== true' api/deep-check.js
          grep -q 'PhishTank' api/deep-check.js
          grep -q 'privacyBlocked' api/deep-check.js
          grep -q 'sensitiveParameters' api/deep-check.js
