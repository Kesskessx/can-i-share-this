name: Validate Link Safety V7.5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-v75:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate API and generator syntax
        run: |
          node --check api/check.js
          node --check api/deep-check.js
          node --check api/event.js
          python3 -m py_compile scripts/generate_scam_safety_cluster.py
          python3 -m py_compile scripts/generate_methodology_page.py
          python3 -m py_compile scripts/generate_authority_pages.py
          python3 -m py_compile scripts/apply_design_polish.py
          python3 -m py_compile scripts/apply_reputation_visibility.py
          python3 -m py_compile scripts/apply_plain_language.py
          python3 -m py_compile scripts/apply_one_click_scan.py
          python3 -m py_compile scripts/apply_link_type_v1.py
          python3 -m py_compile scripts/apply_sensitive_category_v11.py
          python3 -m py_compile scripts/apply_universal_result_v12.py

      - name: Build site
        run: bash build.sh

      - name: Validate safety SEO routes
        shell: bash
        run: |
          set -euo pipefail
          for page in safe-link-checker scam-link-checker phishing-link-checker qr-code-link-checker \
            malware-link-checker short-link-checker how-to-check-if-a-link-is-safe \
            can-a-link-give-you-a-virus how-to-tell-if-a-link-is-phishing \
            how-to-check-a-link-without-clicking-it is-a-bitly-link-safe \
            suspicious-text-message-link fake-package-delivery-link \
            how-to-check-a-qr-code-before-opening; do
            test -f "dist/$page.html"
            grep -q '<meta name="robots" content="index,follow">' "dist/$page.html"
            grep -q "https://canisharethis.com/$page" dist/sitemap.xml
          done

      - name: Validate 10-page anti-scam cluster
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            malware-link-checker
            short-link-checker
            how-to-check-if-a-link-is-safe
            can-a-link-give-you-a-virus
            how-to-tell-if-a-link-is-phishing
            how-to-check-a-link-without-clicking-it
            is-a-bitly-link-safe
            suspicious-text-message-link
            fake-package-delivery-link
            how-to-check-a-qr-code-before-opening
          )
          test "${#pages[@]}" -eq 10
          for page in "${pages[@]}"; do
            file="dist/$page.html"
            grep -q '<meta name="description"' "$file"
            grep -q '<h1>' "$file"
            grep -q 'At a glance' "$file"
            grep -q 'Frequently asked questions' "$file"
            grep -q 'Analyze the link' "$file"
            grep -q 'href="/safe-link-checker"' "$file"
          done
          grep -q 'id="safety-guides-cluster"' dist/safe-link-checker.html
          for page in "${pages[@]}"; do
            grep -q "href=\"/$page\"" dist/safe-link-checker.html
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          pages = [
              'malware-link-checker','short-link-checker','how-to-check-if-a-link-is-safe',
              'can-a-link-give-you-a-virus','how-to-tell-if-a-link-is-phishing',
              'how-to-check-a-link-without-clicking-it','is-a-bitly-link-safe',
              'suspicious-text-message-link','fake-package-delivery-link','how-to-check-a-qr-code-before-opening'
          ]
          titles=[]; descriptions=[]
          for p in pages:
              text=Path(f'dist/{p}.html').read_text(encoding='utf-8')
              titles.append(re.search(r'<title>(.*?)</title>', text, re.S).group(1))
              descriptions.append(re.search(r'<meta name="description" content="(.*?)">', text, re.S).group(1))
          assert len(set(titles)) == 10, 'duplicate cluster title'
          assert len(set(descriptions)) == 10, 'duplicate cluster description'
          PY

      - name: Validate simple one-click homepage
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<h1 id="page-title">Is this link <span class="hero-safe">safe?</span></h1>' dist/index.html
          grep -q 'id="cist-homepage-brand-accent"' dist/index.html
          grep -q 'id="paste"' dist/index.html
          grep -q 'Paste &amp; check' dist/index.html
          grep -q '>Check link</button>' dist/index.html
          grep -q 'Quick check first.' dist/index.html
          grep -q 'runs only after you choose it and confirm' dist/index.html
          grep -q 'AbortController' dist/index.html
          ! grep -q 'deepConfirm.click()' dist/index.html
          grep -q 'What should I do?' dist/index.html
          grep -q 'Share result' dist/index.html
          grep -q 'id="universal-summary"' dist/index.html
          grep -q 'No known malware or phishing' dist/index.html
          grep -q 'href="/qr-code-link-checker"' dist/index.html
          grep -q '/api/event' dist/index.html
          ! grep -q 'Recognizes 91+' dist/index.html
          ! grep -q 'Three steps before you hit Send' dist/index.html
          ! grep -q 'RECIPIENT PREVIEW' dist/index.html

      - name: Validate homepage design polish and trust cues
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/favicon.svg
          grep -q 'href="/favicon.svg"' dist/index.html
          grep -q 'id="cist-design-polish"' dist/index.html
          grep -q 'is-scanning' dist/index.html
          grep -q 'id="risk-meter"' dist/index.html
          grep -q 'id="risk-fill"' dist/index.html
          grep -q "riskFill.style.width=score+'%'" dist/index.html
          grep -q 'radial-gradient' dist/index.html
          grep -q '>What we check<' dist/index.html
          grep -q 'Harmful files' dist/index.html
          grep -q 'Copycat sites' dist/index.html
          grep -q 'id="destination"' dist/index.html
          grep -q 'Where this link goes' dist/index.html
          grep -q 'Destination changed:' dist/index.html
          grep -q 'href="/methodology"' dist/index.html
          grep -q 'href="/favicon.svg"' dist/safe-link-checker.html

      - name: Validate transparent methodology page
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/methodology.html
          grep -q '<meta name="robots" content="index,follow">' dist/methodology.html
          grep -q '<link rel="canonical" href="https://canisharethis.com/methodology">' dist/methodology.html
          grep -q 'How the link safety check works' dist/methodology.html
          grep -q 'What the quick scan checks' dist/methodology.html
          grep -q 'Optional reputation checks' dist/methodology.html
          grep -q 'What the scanner cannot guarantee' dist/methodology.html
          grep -q 'https://canisharethis.com/methodology' dist/sitemap.xml
          grep -q 'href="/favicon.svg"' dist/methodology.html

      - name: Validate five authority reference pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(how-link-scanning-works phishing-url-signals lookalike-domain-examples redirect-risk-explained shortened-url-risks)
          test "${#pages[@]}" -eq 5
          for page in "${pages[@]}"; do
            file="dist/$page.html"
            test -f "$file"
            grep -q '<meta name="robots" content="index,follow">' "$file"
            grep -q "<link rel=\"canonical\" href=\"https://canisharethis.com/$page\">" "$file"
            grep -q '"@type":"Article"' "$file"
            grep -q 'At a glance' "$file"
            grep -q 'Primary references' "$file"
            grep -q 'Last reviewed: September 2, 2026.' "$file"
            grep -q 'href="/favicon.svg"' "$file"
            grep -q "https://canisharethis.com/$page" dist/sitemap.xml
            grep -q "href=\"/$page\"" dist/methodology.html
            grep -q "href=\"/$page\"" dist/safe-link-checker.html
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          pages=['how-link-scanning-works','phishing-url-signals','lookalike-domain-examples','redirect-risk-explained','shortened-url-risks']
          titles=[]; descriptions=[]
          for p in pages:
              text=Path(f'dist/{p}.html').read_text(encoding='utf-8')
              titles.append(re.search(r'<title>(.*?)</title>', text, re.S).group(1))
              descriptions.append(re.search(r'<meta name="description" content="(.*?)">', text, re.S).group(1))
          assert len(set(titles)) == 5, 'duplicate authority title'
          assert len(set(descriptions)) == 5, 'duplicate authority description'
          PY

      - name: Validate Web Risk and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GOOGLE_WEB_RISK_API_KEY' api/deep-check.js
          grep -q 'webrisk.googleapis.com/v1/uris:search' api/deep-check.js
          grep -q "'MALWARE'" api/deep-check.js
          grep -q "'SOCIAL_ENGINEERING'" api/deep-check.js
          grep -q "'UNWANTED_SOFTWARE'" api/deep-check.js
          ! grep -q 'SOCIAL_ENGINEERING_EXTENDED_COVERAGE' api/deep-check.js
          grep -q 'body.consent !== true' api/deep-check.js
          grep -q 'privacyBlocked' api/deep-check.js
          grep -q 'sensitiveParameters' api/deep-check.js
          grep -q "homepage_view.*paste.*analyze.*deep_scan" api/event.js
          grep -q 'do not log the scanned URL' api/event.js

      - name: Validate QR scanner stays local
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BarcodeDetector' dist/qr-code-link-checker.html
          grep -q "sessionStorage.setItem('cist_pending_url'" dist/qr-code-link-checker.html
          grep -q 'not uploaded to our server' dist/qr-code-link-checker.html
          ! grep -q '/api/' dist/qr-code-link-checker.html

      - name: Validate share result does not share scanned URL
        shell: bash
        run: |
          set -euo pipefail
          grep -q "navigator.share" dist/index.html
          grep -q 'https://canisharethis.com/' dist/index.html
          ! grep -q 'navigator.share({url:currentUrl' dist/index.html
          ! grep -q 'writeText(currentUrl' dist/index.html
