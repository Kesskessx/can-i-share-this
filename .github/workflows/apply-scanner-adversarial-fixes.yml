name: Apply scanner adversarial fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_scanner_adversarial_gaps.py'
      - '.github/workflows/apply-scanner-adversarial-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python scripts/fix_scanner_adversarial_gaps.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No scanner changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/python_scan.py
          git commit -m "Fix adversarial scanner gaps"
          git push
