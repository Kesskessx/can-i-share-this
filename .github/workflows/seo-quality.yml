name: SEO route integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  seo-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate prepared safety and SEO specifications
        run: python3 scripts/validate_prepared_batch.py

      - name: Build and audit every canonical route
        run: bash build.sh

      - name: Run Universal Safety Checker regression matrix
        run: node scripts/test_universal_matrix.js

      - name: Validate scanner performance budgets and consent
        run: node scripts/test_scanner_performance.js
