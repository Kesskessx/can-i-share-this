name: Validate production candidate

on:
  push:
    branches:
      - main
      - production-ready-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate API syntax
        run: |
          node --check api/check.js
          node --check api/deep-check.js
          node --check api/counter.js
          node --check api/feedback.js

      - name: Build production candidate
        run: bash build.sh

      - name: Validate production indexing and routes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'User-agent: \*' dist/robots.txt
          grep -q 'Allow: /' dist/robots.txt
          grep -q 'https://canisharethis.com/sitemap.xml' dist/robots.txt
          INDEXNOW_KEY="$(tr -d '\r\n' < seo/indexnow-key.txt)"
          test -f "dist/${INDEXNOW_KEY}.txt"
          test "$(tr -d '\r\n' < "dist/${INDEXNOW_KEY}.txt")" = "$INDEXNOW_KEY"
          for page in \
            google-drive-link-checker \
            google-drive-permission-checker \
            google-drive-link-not-working \
            google-drive-folder-sharing-checker \
            google-drive-share-link-test \
            dropbox-link-checker \
            dropbox-shared-link-not-working \
            dropbox-permission-checker \
            dropbox-link-expiration-checker \
            drive-vs-dropbox-share-link-checker \
            safe-link-checker \
            scam-link-checker \
            phishing-link-checker; do
            echo "Validating $page"
            test -f "dist/$page.html"
            grep -q "https://canisharethis.com/$page" dist/sitemap.xml
            grep -q '<meta name="robots" content="index,follow">' "dist/$page.html"
          done

      - name: Validate internal-link architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="/google-drive-link-checker"' dist/index.html
          grep -q 'href="/dropbox-link-checker"' dist/index.html
          grep -q 'href="/drive-vs-dropbox-share-link-checker"' dist/index.html
          grep -q 'href="/safe-link-checker"' dist/index.html
          grep -q 'href="/scam-link-checker"' dist/index.html
          grep -q 'href="/phishing-link-checker"' dist/index.html
          grep -q 'href="/google-drive-permission-checker"' dist/google-drive-link-checker.html
          grep -q 'href="/google-drive-link-checker"' dist/google-drive-permission-checker.html
          grep -q 'href="/dropbox-permission-checker"' dist/dropbox-link-checker.html
          grep -q 'href="/dropbox-link-checker"' dist/dropbox-permission-checker.html
          grep -q 'href="/dropbox-link-expiration-checker"' dist/dropbox-link-checker.html
          grep -q 'Quick Google Drive Link Test' dist/check-google-drive-link.html
          grep -q 'href="/google-drive-link-checker"' dist/check-google-drive-link.html
          grep -q 'Quick Dropbox Link Test' dist/check-dropbox-link.html
          grep -q 'href="/dropbox-link-checker"' dist/check-dropbox-link.html
          grep -q '"@type":"WebSite"' dist/index.html

      - name: Validate production API routing
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'canisharethis.com/api/' vercel.json
          ! grep -qi 'noindex' vercel.json
          test -f api/check.js
          test -f api/deep-check.js
          test -f api/counter.js
          test -f api/feedback.js

      - name: Notify Bing and IndexNow
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          INDEXNOW_KEY="$(tr -d '\r\n' < seo/indexnow-key.txt)"
          KEY_URL="https://canisharethis.com/${INDEXNOW_KEY}.txt"
          READY=0
          for attempt in $(seq 1 30); do
            LIVE_KEY="$(curl -fsSL --max-time 10 "$KEY_URL" 2>/dev/null || true)"
            if [ "$LIVE_KEY" = "$INDEXNOW_KEY" ]; then
              READY=1
              break
            fi
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then
            echo "::warning::IndexNow key is not live yet; skipping this submission."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import pathlib
          import re
          key = pathlib.Path('seo/indexnow-key.txt').read_text().strip()
          xml = pathlib.Path('dist/sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>\s*(.*?)\s*</loc>', xml, flags=re.I | re.S)
          payload = {
              'host': 'canisharethis.com',
              'key': key,
              'keyLocation': f'https://canisharethis.com/{key}.txt',
              'urlList': urls,
          }
          pathlib.Path('/tmp/indexnow.json').write_text(json.dumps(payload), encoding='utf-8')
          print(f'Prepared {len(urls)} URLs for IndexNow')
          PY
          HTTP_CODE="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json || true)"
          case "$HTTP_CODE" in
            200|202)
              echo "IndexNow accepted the sitemap URLs (HTTP $HTTP_CODE)."
              ;;
            *)
              echo "::warning::IndexNow returned HTTP ${HTTP_CODE:-unknown}."
              cat /tmp/indexnow-response.txt 2>/dev/null || true
              ;;
          esac
