name: Validate Link Type V1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-type-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch syntax
        run: |
          python3 -m py_compile scripts/apply_link_type_v1.py
          python3 -m py_compile scripts/apply_sensitive_category_v11.py
          python3 -m py_compile scripts/apply_universal_result_v12.py
          python3 -m py_compile scripts/apply_recommended_action_v13.py
          python3 -m py_compile scripts/apply_benchmark_upgrades_v16.py
          node --check api/check.js
          node --check api/domain-age.js

      - name: Build site
        run: bash build.sh

      - name: Validate universal summary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="universal-summary"' dist/index.html
          grep -q 'At a glance' dist/index.html
          grep -q 'id="universal-safety-value"' dist/index.html
          grep -q 'id="universal-content-value"' dist/index.html
          grep -q 'id="universal-destination-value"' dist/index.html
          grep -q 'id="universal-advice-value"' dist/index.html
          grep -q "'Email address'" dist/index.html
          grep -q "'Mailbox and sender domain'" dist/index.html
          grep -q "'Sender domain'" dist/index.html
          grep -q 'Address and domain checks cannot prove who controls a mailbox.' dist/index.html

      - name: Validate recommended action V1.3
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="recommended-action"' dist/index.html
          grep -q 'Recommended action' dist/index.html
          grep -q 'Do not open this link' dist/index.html
          grep -q 'Verify before continuing' dist/index.html
          grep -q 'No known threat found — continue only if expected' dist/index.html
          grep -q 'Run the full safety check first' dist/index.html
          grep -q 'Verify the sender before replying' dist/index.html
          grep -q 'No obvious address warning signs — stay cautious' dist/index.html
          grep -q "card.classList.contains('reputation-checked-safe')" dist/index.html
          grep -q 'The link redirects to a different website.' dist/index.html
          grep -q 'No scanner can guarantee that a website is safe.' dist/index.html

      - name: Validate risk breakdown V1.4
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="risk-breakdown"' dist/index.html
          grep -q 'Risk breakdown' dist/index.html
          grep -q 'Four independent signal groups — not a safety guarantee.' dist/index.html
          grep -q '>Reputation<' dist/index.html
          grep -q '>URL signals<' dist/index.html
          grep -q '>Destination<' dist/index.html
          grep -q '>Content<' dist/index.html
          grep -q "'Address signals'" dist/index.html
          grep -q "'Mail delivery'" dist/index.html
          grep -q "'Authentication'" dist/index.html
          grep -q "'Domain age'" dist/index.html
          grep -q 'risk-factor-symbol' dist/index.html
          grep -q 'risk-factor-state' dist/index.html
          grep -q "'High risk'" dist/index.html
          grep -q "'Review'" dist/index.html
          grep -q "'No known issue'" dist/index.html
          ! grep -q '100% safe' dist/index.html

      - name: Validate benchmark UX and credibility V1.6
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="how-it-works"' dist/index.html
          grep -q 'Three steps. One clear answer.' dist/index.html
          grep -q '>Paste<' dist/index.html
          grep -q '>We check<' dist/index.html
          grep -q '>Decide<' dist/index.html
          grep -q 'id="scanner-proof"' dist/index.html
          grep -q 'Google Web Risk' dist/index.html
          grep -q 'Redirect analysis' dist/index.html
          grep -q 'File type detection' dist/index.html
          grep -q 'Domain age via RDAP' dist/index.html
          grep -q 'We do not show an accuracy percentage unless it has been independently validated.' dist/index.html

      - name: Validate use-case SEO cluster V1.6
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/suspicious-text-message-link' dist/index.html
          grep -q '/whatsapp-link-checker' dist/index.html
          grep -q '/email-safety-checker' dist/index.html
          grep -q '/qr-code-link-checker' dist/index.html
          grep -q '/download-link-checker' dist/index.html
          for slug in whatsapp-link-checker download-link-checker; do
            test -s "dist/${slug}.html"
            grep -q '<meta name="robots" content="index,follow">' "dist/${slug}.html"
            grep -q "https://canisharethis.com/${slug}" "dist/${slug}.html"
            grep -q 'FAQPage' "dist/${slug}.html"
            grep -q "https://canisharethis.com/${slug}" dist/sitemap.xml
          done
          grep -q 'Does this checker read my WhatsApp messages?' dist/whatsapp-link-checker.html
          grep -q 'Does the checker run or install the file?' dist/download-link-checker.html

      - name: Validate URL domain age V1.6
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RDAP_TIMEOUT_MS = 2500' api/domain-age.js
          grep -q 'https://rdap.org/domain/' api/domain-age.js
          grep -q 'Only the registered domain is queried. The full URL is not sent for this lookup.' api/domain-age.js
          grep -q 'id="url-domain-age"' dist/index.html
          grep -q "fetch('/api/domain-age'" dist/index.html
          grep -q 'Very new domain — verify it carefully.' dist/index.html
          grep -q 'Older domains can still be compromised' dist/index.html
          grep -q 'data-url-domain-age-tech' dist/index.html

      - name: Validate lightweight classification coverage
        shell: bash
        run: |
          set -euo pipefail
          grep -q "label:'Music or audio'" dist/index.html
          grep -q "label:'Video'" dist/index.html
          grep -q "label:'Image'" dist/index.html
          grep -q "label:'PDF document'" dist/index.html
          grep -q "label:'Document or data file'" dist/index.html
          grep -q "label:'Compressed file'" dist/index.html
          grep -q "label:'Software or app file'" dist/index.html
          grep -q "label:'Cloud file or folder'" dist/index.html
          grep -q "label:'Social media'" dist/index.html
          grep -q "label:'Shopping link'" dist/index.html
          grep -q "label:'Shortened link'" dist/index.html
          grep -q "platform:'YouTube'" dist/index.html
          grep -q "platform:'Spotify'" dist/index.html
          grep -q "platform:'Google Drive'" dist/index.html
          grep -q "platform:'Dropbox'" dist/index.html

      - name: Validate real response type detection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function cistTypeFromResponse(data)' dist/index.html
          grep -q "mime==='application/pdf'" dist/index.html
          grep -q "mime.indexOf('audio/')===0" dist/index.html
          grep -q "mime.indexOf('video/')===0" dist/index.html
          grep -q "mime.indexOf('image/')===0" dist/index.html
          grep -q 'application/x-msdownload' dist/index.html
          grep -q 'contentType: cleanContentType' api/check.js
          grep -q 'fileName: fileName' api/check.js

      - name: Validate redirects and plain-language advice
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'This link changes destination' dist/index.html
          grep -q "route.hosts.join(' → ')" dist/index.html
          grep -q 'Unexpected software can harm your device.' dist/index.html
          grep -q 'Compressed files can hide other files inside.' dist/index.html
          grep -q 'Short links hide the real website until they are followed.' dist/index.html

      - name: Validate sensitive category V1.1
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="content-warning"' dist/index.html
          grep -q 'Content category' dist/index.html
          grep -q "'gamdom.com'" dist/index.html
          grep -q "typeLabel:'Gambling / betting website'" dist/index.html
          grep -q "typeLabel:'Adult-content website'" dist/index.html
          grep -q "typeLabel:'Torrent / file-sharing website'" dist/index.html
          grep -q "typeLabel:'Crypto / financial website'" dist/index.html
          grep -q "typeLabel:'Weapons-related website'" dist/index.html
          grep -q "typeLabel:'Drug-related website'" dist/index.html
          grep -q 'No known malware or phishing threat' dist/index.html
          grep -q 'renderSensitiveCategory(data);renderUniversalResult(data);' dist/index.html

      - name: Validate conservative fallback
        shell: bash
        run: |
          set -euo pipefail
          grep -q "label:'Website',detail:'A regular web page'" dist/index.html
          grep -q 'renderQuick(data){renderLinkType(data);renderSensitiveCategory(data);renderUniversalResult(data);' dist/index.html
          ! grep -q '100% safe' dist/index.html
