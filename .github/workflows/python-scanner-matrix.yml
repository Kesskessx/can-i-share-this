name: Python scanner format matrix

on:
  push:
    branches: [main]
    paths:
      - 'api/python_scan.py'
      - 'scripts/test_python_scan_matrix.py'
      - '.github/workflows/python-scanner-matrix.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scanner matrix
        run: python scripts/test_python_scan_matrix.py
