name: Apply Python filename classification fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-python-filename-fix.yml'
      - 'scripts/apply_python_file_type_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scanner file classification
        run: python scripts/apply_python_file_type_fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/python_scan.py
          git commit -m "Classify uploaded filenames as file content"
          git push origin HEAD:main
