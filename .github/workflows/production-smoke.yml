name: Production smoke checks

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production alias propagation
        run: sleep 10

      - name: Run production smoke checks
        env:
          SMOKE_BASE_URL: https://canisharethis.com
          SMOKE_TIMEOUT_SECONDS: "12"
        run: python3 scripts/smoke_production.py
