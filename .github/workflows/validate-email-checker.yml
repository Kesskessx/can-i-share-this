name: Validate Email Safety

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript and integration syntax
        run: |
          node --check lib/email-safety.js
          node --check api/email-check.js
          node --check scripts/test_email_safety.js
          python3 -m py_compile scripts/apply_email_input.py

      - name: Run deterministic email safety tests
        run: node scripts/test_email_safety.js

      - name: Validate backend privacy contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'console.log' api/email-check.js
          grep -q "inputType: 'email'" api/email-check.js
          grep -q 'SPF and DMARC presence' lib/email-safety.js
          grep -q 'Brand-lookalike patterns' lib/email-safety.js
          grep -q 'Disposable-domain signals' lib/email-safety.js

      - name: Build site with email integration
        run: bash build.sh

      - name: Validate universal homepage input
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Paste a link or email address…' dist/index.html
          grep -q 'Link or email address to analyze' dist/index.html
          grep -q 'Inputs aren’t stored' dist/index.html
          grep -q "'/api/email-check'" dist/index.html
          grep -q "'/api/check'" dist/index.html
          grep -q "currentInputType==='email'" dist/index.html
          grep -q 'Email domain' dist/index.html
          grep -q 'MX records' dist/index.html
          grep -q '>SPF<' dist/index.html
          grep -q '>DMARC<' dist/index.html
          grep -q "if(currentInputType==='url')trackScanSummary(d)" dist/index.html
          grep -q 'Check reputation' dist/index.html

      - name: Validate email result privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "currentInputType==='email'?'/api/email-check':'/api/check'" dist/index.html
          grep -q "currentInputType==='email'?{input:currentUrl}:{url:currentUrl}" dist/index.html
          grep -q "if(currentInputType==='email')return" dist/index.html
          ! grep -q "trackScanSummary(d).*currentInputType==='email'" dist/index.html
