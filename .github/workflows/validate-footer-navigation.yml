name: Validate Footer Navigation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footer-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate footer patch syntax
        run: python3 -m py_compile scripts/apply_footer_navigation.py

      - name: Build site
        run: bash build.sh

      - name: Validate homepage footer
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="site-footer"' dist/index.html
          grep -q 'class="footer-resources"' dist/index.html
          grep -q '>Safety resources<' dist/index.html
          grep -q 'href="/safe-link-checker">Safe link<' dist/index.html
          grep -q 'href="/google-drive-link-checker">Google Drive<' dist/index.html
          grep -q 'href="/dropbox-link-checker">Dropbox<' dist/index.html
          grep -q 'href="/scam-prevention">Scam Prevention<' dist/index.html
          grep -q 'No scanner can guarantee that a link or sender is safe.' dist/index.html
          grep -q 'Privacy-first · No signup' dist/index.html
          grep -q '@CanIShareLink' dist/index.html
          grep -q 'cist-footer-navigation-style' dist/index.html
          ! grep -q 'cist-footer-navigation-script' dist/index.html
          ! grep -q 'class="footer-grid"' dist/index.html
          ! grep -q 'class="footer-brand"' dist/index.html

      - name: Validate linked destinations exist
        shell: bash
        run: |
          set -euo pipefail
          for slug in scam-prevention safe-link-checker google-drive-link-checker dropbox-link-checker; do
            test -s "dist/${slug}.html"
          done
