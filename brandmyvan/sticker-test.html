<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brand My Van — 3D Sponsor Sticker Test</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#111;font-family:Arial,Helvetica,sans-serif}.top{padding:18px 22px;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:22px}.brand b{background:#dcff29;padding:4px 6px}.live{background:#dcff29;border-bottom:1px solid #111;padding:12px 22px;display:flex;gap:28px;flex-wrap:wrap}.live span{font-size:12px;font-weight:900}.stage{position:relative;height:72vh;min-height:520px;background:#faf9f5;overflow:hidden}#van{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hotspots{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;width:34px;height:34px;border-radius:50%;background:#dcff29;border:1px solid #111;font-weight:900;pointer-events:auto;transform:translate(-50%,-50%)}.hint{position:absolute;top:16px;left:16px;background:#111;color:#fff;padding:10px 12px;font-size:11px;font-weight:900;z-index:3}.tools{position:absolute;top:62px;left:16px;z-index:3;display:flex;gap:8px}.tools button{padding:10px 12px;border:1px solid #111;background:#f4f1e8;font-weight:900}.selected{position:absolute;left:16px;right:16px;bottom:16px;background:#f4f1e8;border:1px solid #111;padding:14px 16px;display:flex;justify-content:space-between;z-index:3}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #111;border-left:1px solid #111}.card{border:0;border-right:1px solid #111;border-bottom:1px solid #111;background:transparent;padding:16px;min-height:150px;text-align:left}.card.active{background:#dcff29}.live-bid{margin-top:10px;border-top:1px solid #111;padding-top:8px}.bid-now{margin-top:8px;background:#111;color:#fff;border:0;padding:9px 10px;font-weight:900}.wrap{padding:28px 22px}.wrap h2{font-size:42px;margin:0 0 16px}dialog{width:min(520px,calc(100% - 28px));border:1px solid #111;background:#f4f1e8}.form{display:grid;gap:12px}.form input{width:100%;padding:10px}.form button{padding:12px;background:#dcff29;border:1px solid #111;font-weight:900}.logo-preview{max-width:100px;max-height:60px}.activity-row{display:grid;grid-template-columns:1fr 1fr auto;padding:10px 0;border-top:1px solid #111}@media(max-width:700px){.stage{height:65vh;min-height:480px}.grid{grid-template-columns:1fr 1fr}.wrap h2{font-size:34px}.selected{font-size:12px}}</style><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script></head><body><div class="top"><div class="brand">BRAND <b>MYVAN</b></div><div id="auction-status">CONNECTING…</div></div><div class="live"><span>TIME LEFT: <b id="countdown">--</b></span><span>TOTAL: <b id="raised">€0</b></span><span>BIDS: <b id="bidtotal">0</b></span></div><div class="stage"><div id="van"></div><div class="hotspots" id="hotspots"></div><div class="hint" id="status">LOADING THE REAL VAN…</div><div class="tools"><button id="reset">RESET VIEW</button><button id="rotate">AUTO ROTATE</button></div><div class="selected"><span id="selname"></span><strong id="selprice"></strong></div></div><div class="wrap"><h2>Live sponsor sticker test</h2><p>The winning sponsor logo is rendered inside the 3D scene as a sticker on the selected body panel.</p><div class="grid" id="grid"></div><div id="activity-list" style="margin-top:25px"></div><div style="display:none"><span id="goal"></span><span id="fundpct"></span><div id="fundbar"></div></div></div><dialog id="bid-modal"><button id="bid-close" style="float:right">×</button><h3 id="modal-title">Place a bid</h3><div id="modal-current"></div><form class="form" id="bid-form"><input name="company" placeholder="Company" required><input name="email" type="email" placeholder="Email" required><input name="website" placeholder="Website"><input id="bid-amount" name="amount" type="number" required><input id="logo-input" name="logo" type="file" accept="image/png,image/jpeg,image/webp"><img id="logo-preview" class="logo-preview" hidden><div id="bid-min"></div><input name="websiteTrap" style="display:none"><div id="bid-error"></div><button type="submit">PLACE LIVE BID ↗</button></form></dialog><div id="bid-toast"></div><script type="module" src="./viewer.js"></script><script src="./auction.js" defer></script></body></html>
