function applyFlip(tex,flip){if(!flip)return;tex.wrapS=T.RepeatWrapping;tex.repeat.x=-1;tex.offset.x=1;tex.needsUpdate=true}

function buildMesh(z,i,tex,isWinner){const ctr=new T.Vector3(z[0],z[1],z[2]),right=new T.Vector3(z[3],z[4],z[5]).normalize(),up=new T.Vector3(z[6],z[7],z[8]).normalize(),w=z[9],h=z[10],n=new T.Vector3(z[11],z[12],z[13]).normalize();const g=new T.PlaneGeometry(w,h,isWinner?46:32,isWinner?28:20),p=g.attributes.position;let hits=0;for(let k=0;k<p.count;k++){const q=ctr.clone().add(right.clone().multiplyScalar(p.getX(k))).add(up.clone().multiplyScalar(p.getY(k)));ray.set(q.clone().add(n.clone().multiplyScalar(30)),n.clone().multiplyScalar(-1));const hit=ray.intersectObjects(targets,true).find(v=>{if(!v.face)return false;const wn=v.face.normal.clone().transformDirection(v.object.matrixWorld).normalize();return wn.dot(n)>.18});let out;if(hit){hits++;const wn=hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();out=hit.point.clone().add(wn.multiplyScalar(.035))}else out=q.clone().add(n.clone().multiplyScalar(.035));const l=grp.worldToLocal(out.clone());p.setXYZ(k,l.x,l.y,l.z)}g.computeVertexNormals();const mat=new T.MeshStandardMaterial({map:tex,transparent:true,side:T.DoubleSide,depthWrite:false,roughness:.82,metalness:0,polygonOffset:true,polygonOffsetFactor:-8,polygonOffsetUnits:-8,alphaTest:.015});const m=new T.Mesh(g,mat);m.userData={free:!isWinner,spot:i+1,hitRatio:hits/p.count};m.renderOrder=20;grp.add(m);return m}
